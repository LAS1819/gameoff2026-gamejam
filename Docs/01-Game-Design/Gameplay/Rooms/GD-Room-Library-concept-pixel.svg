<svg width="960" height="540" viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <rect width="960" height="540" fill="#171315"/>

  <g>
    <!-- Background wall -->
    <rect x="0" y="0" width="960" height="540" fill="#1a171a"/>

    <!-- Warm normal light -->
    <rect x="0" y="0" width="960" height="540" fill="#2a1d1d" opacity="0.22"/>

    <!-- Floor -->
    <rect x="0" y="360" width="960" height="180" fill="#120d12"/>

    <!-- Left shelf -->
    <g>
      <rect x="80" y="100" width="220" height="180" fill="#2b2124"/>
      <rect x="90" y="110" width="200" height="12" fill="#382d2d"/>
      <rect x="90" y="150" width="200" height="12" fill="#382d2d"/>
      <rect x="90" y="190" width="200" height="12" fill="#382d2d"/>
      <rect x="90" y="230" width="200" height="12" fill="#382d2d"/>
      <rect x="90" y="270" width="200" height="12" fill="#382d2d"/>

      <rect x="110" y="120" width="16" height="150" fill="#70503d"/>
      <rect x="140" y="120" width="16" height="150" fill="#8d684f"/>
      <rect x="170" y="120" width="16" height="150" fill="#495b69"/>
      <rect x="200" y="120" width="16" height="150" fill="#724642"/>
      <rect x="230" y="120" width="16" height="150" fill="#d4a56c"/>
      <rect x="260" y="120" width="16" height="150" fill="#7b5d52"/>
    </g>

    <!-- Center shelf -->
    <g>
      <rect x="350" y="80" width="260" height="200" fill="#2a2022"/>
      <rect x="360" y="90" width="240" height="12" fill="#3f3233"/>
      <rect x="360" y="140" width="240" height="12" fill="#3f3233"/>
      <rect x="360" y="190" width="240" height="12" fill="#3f3233"/>
      <rect x="360" y="240" width="240" height="12" fill="#3f3233"/>

      <rect x="390" y="100" width="18" height="140" fill="#7b5341"/>
      <rect x="430" y="100" width="16" height="140" fill="#8d6856"/>
      <rect x="470" y="100" width="18" height="140" fill="#8c3f45"/>
      <rect x="510" y="100" width="18" height="140" fill="#d7b065"/>
      <rect x="548" y="100" width="16" height="140" fill="#6d7c82"/>
      <rect x="580" y="100" width="18" height="140" fill="#a86a52"/>
    </g>

    <!-- Right shelf -->
    <g>
      <rect x="660" y="100" width="220" height="180" fill="#2b1f21"/>
      <rect x="670" y="110" width="200" height="12" fill="#3a2d2d"/>
      <rect x="670" y="150" width="200" height="12" fill="#3a2d2d"/>
      <rect x="670" y="190" width="200" height="12" fill="#3a2d2d"/>
      <rect x="670" y="230" width="200" height="12" fill="#3a2d2d"/>
      <rect x="670" y="270" width="200" height="12" fill="#3a2d2d"/>

      <rect x="690" y="120" width="16" height="150" fill="#7d5350"/>
      <rect x="720" y="120" width="16" height="150" fill="#d19b62"/>
      <rect x="750" y="120" width="16" height="150" fill="#5a6e7a"/>
      <rect x="780" y="120" width="16" height="150" fill="#824a55"/>
      <rect x="810" y="120" width="16" height="150" fill="#c7b582"/>
      <rect x="840" y="120" width="16" height="150" fill="#6a494f"/>
    </g>

    <!-- Center desk -->
    <g>
      <rect x="360" y="315" width="240" height="28" fill="#403436"/>
      <rect x="390" y="245" width="180" height="70" fill="#251d20" stroke="#8b6d60" stroke-width="4"/>
      <rect x="420" y="210" width="120" height="38" fill="#342c2e"/>
      <rect x="442" y="170" width="76" height="40" fill="#7c615c"/>
      <rect x="455" y="150" width="50" height="22" fill="#d4b777"/>
      <rect x="460" y="120" width="40" height="32" fill="#785a4a"/>
    </g>

    <!-- Interior reveal / secret hidden door -->
    <g>
      <rect x="700" y="255" width="120" height="170" fill="#201718" stroke="#cf9a63" stroke-width="4"/>
      <rect x="710" y="265" width="100" height="150" fill="#b46d41" opacity="0.18"/>
      <rect x="720" y="275" width="80" height="10" fill="#f2d1a1" opacity="0.75"/>
      <rect x="720" y="305" width="80" height="10" fill="#f2d1a1" opacity="0.75"/>
      <rect x="720" y="335" width="80" height="10" fill="#f2d1a1" opacity="0.75"/>
      <rect x="720" y="365" width="80" height="10" fill="#f2d1a1" opacity="0.75"/>
      <rect x="720" y="395" width="80" height="10" fill="#f2d1a1" opacity="0.75"/>
    </g>

    <!-- Example FX: other-side glow -->
    <rect x="0" y="0" width="960" height="540" fill="#8f3e47" opacity="0.07"/>
    <rect x="560" y="0" width="400" height="540" fill="#c67247" opacity="0.05"/>

    <!-- Dust as little pixels -->
    <g fill="#e8d8b9" opacity="0.7">
      <rect x="120" y="120" width="2" height="2"/>
      <rect x="240" y="200" width="2" height="2"/>
      <rect x="458" y="88" width="2" height="2"/>
      <rect x="678" y="150" width="2" height="2"/>
      <rect x="789" y="220" width="2" height="2"/>
      <rect x="680" y="420" width="2" height="2"/>
      <rect x="430" y="440" width="2" height="2"/>
      <rect x="180" y="280" width="2" height="2"/>
      <rect x="820" y="350" width="2" height="2"/>
      <rect x="900" y="270" width="2" height="2"/>
    </g>
  </g>
</svg>
