<svg width="1800" height="1200" viewBox="0 0 1800 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#1b1a1d"/>
      <stop offset="45%" stop-color="#2b1f1e"/>
      <stop offset="100%" stop-color="#170e12"/>
    </linearGradient>
    <linearGradient id="wallWarm" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#3b2a2c"/>
      <stop offset="100%" stop-color="#21191d"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#2a1a18"/>
      <stop offset="100%" stop-color="#120c10"/>
    </linearGradient>
    <linearGradient id="otherGlow" x1="0" x2="1">
      <stop offset="0%" stop-color="#d68a50"/>
      <stop offset="100%" stop-color="#7c2d4d"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="dust" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  <rect width="1800" height="1200" fill="url(#bg)"/>

  <g opacity="0.9">
    <circle cx="1130" cy="250" r="160" fill="#7a3d4a" opacity="0.22"/>
    <circle cx="760" cy="260" r="170" fill="#d9a267" opacity="0.12"/>
  </g>

  <!-- Main room walls -->
  <rect x="120" y="120" width="1560" height="840" rx="14" fill="url(#wallWarm)"/>
  <path d="M120 880 L1680 880 L1810 1180 L0 1180 Z" fill="url(#floor)"/>

  <!-- Back shelves -->
  <g opacity="0.95">
    <rect x="230" y="170" width="380" height="420" fill="#312325" stroke="#5d443f" stroke-width="6"/>
    <rect x="700" y="170" width="380" height="420" fill="#312325" stroke="#5d443f" stroke-width="6"/>
    <rect x="1170" y="170" width="380" height="420" fill="#312325" stroke="#5d443f" stroke-width="6"/>

    <g fill="#2d2124">
      <rect x="255" y="210" width="330" height="18"/>
      <rect x="725" y="210" width="330" height="18"/>
      <rect x="1195" y="210" width="330" height="18"/>
      <rect x="255" y="290" width="330" height="18"/>
      <rect x="725" y="290" width="330" height="18"/>
      <rect x="1195" y="290" width="330" height="18"/>
      <rect x="255" y="370" width="330" height="18"/>
      <rect x="725" y="370" width="330" height="18"/>
      <rect x="1195" y="370" width="330" height="18"/>
      <rect x="255" y="450" width="330" height="18"/>
      <rect x="725" y="450" width="330" height="18"/>
      <rect x="1195" y="450" width="330" height="18"/>
    </g>

    <!-- Books -->
    <g>
      <rect x="275" y="230" width="34" height="180" fill="#a96d52" rx="4"/>
      <rect x="317" y="230" width="28" height="180" fill="#b88f5e" rx="4"/>
      <rect x="355" y="230" width="30" height="180" fill="#7d5f69" rx="4"/>
      <rect x="396" y="230" width="38" height="180" fill="#7c4a4d" rx="4"/>
      <rect x="442" y="230" width="28" height="180" fill="#d7c088" rx="4"/>

      <rect x="745" y="230" width="36" height="180" fill="#7d5767" rx="4"/>
      <rect x="789" y="230" width="32" height="180" fill="#c57d4b" rx="4"/>
      <rect x="829" y="230" width="30" height="180" fill="#8f7f5d" rx="4"/>
      <rect x="867" y="230" width="34" height="180" fill="#9b6255" rx="4"/>
      <rect x="909" y="230" width="30" height="180" fill="#d4b269" rx="4"/>

      <rect x="1218" y="230" width="34" height="180" fill="#86624e" rx="4"/>
      <rect x="1260" y="230" width="32" height="180" fill="#8c3d44" rx="4"/>
      <rect x="1300" y="230" width="30" height="180" fill="#d9b777" rx="4"/>
      <rect x="1342" y="230" width="38" height="180" fill="#5c6978" rx="4"/>
      <rect x="1390" y="230" width="28" height="180" fill="#6f797e" rx="4"/>
    </g>

    <g>
      <rect x="275" y="470" width="34" height="110" fill="#7b4d45" rx="4"/>
      <rect x="317" y="470" width="28" height="110" fill="#9c7e57" rx="4"/>
      <rect x="355" y="470" width="30" height="110" fill="#6b4f4b" rx="4"/>
      <rect x="396" y="470" width="38" height="110" fill="#b9ac78" rx="4"/>
      <rect x="442" y="470" width="28" height="110" fill="#81595e" rx="4"/>

      <rect x="745" y="470" width="36" height="110" fill="#986551" rx="4"/>
      <rect x="789" y="470" width="32" height="110" fill="#8a6a57" rx="4"/>
      <rect x="829" y="470" width="30" height="110" fill="#d1ca9d" rx="4"/>
      <rect x="867" y="470" width="34" height="110" fill="#5b4650" rx="4"/>
      <rect x="909" y="470" width="30" height="110" fill="#7a8f90" rx="4"/>

      <rect x="1218" y="470" width="34" height="110" fill="#8d5e4f" rx="4"/>
      <rect x="1260" y="470" width="32" height="110" fill="#d3b174" rx="4"/>
      <rect x="1300" y="470" width="30" height="110" fill="#7e5d65" rx="4"/>
      <rect x="1342" y="470" width="38" height="110" fill="#6a5265" rx="4"/>
      <rect x="1390" y="470" width="28" height="110" fill="#b58d62" rx="4"/>
    </g>
  </g>

  <!-- Central table -->
  <g>
    <rect x="670" y="700" width="460" height="28" fill="#4d3634" rx="12"/>
    <rect x="705" y="620" width="390" height="88" fill="#261d20" stroke="#8d6960" stroke-width="4"/>
    <rect x="794" y="525" width="214" height="96" fill="#1d181c" stroke="#8d6960" stroke-width="4"/>
    <rect x="810" y="430" width="182" height="94" fill="#433334"/>
    <rect x="856" y="350" width="90" height="84" fill="#685752" opacity="0.7"/>
    <rect x="875" y="315" width="52" height="48" fill="#d9b77a" opacity="0.7"/>
  </g>

  <!-- Hidden secret door / other side reveal -->
  <g>
    <rect x="1320" y="440" width="200" height="270" fill="#2b1d1f" stroke="#d7a56e" stroke-width="5"/>
    <rect x="1360" y="472" width="120" height="206" fill="url(#otherGlow)" opacity="0.22" filter="url(#softGlow)"/>
    <path d="M1350 688 L1505 688" stroke="#e7b46f" stroke-width="5" opacity="0.8"/>
    <circle cx="1422" cy="520" r="16" fill="#f1d7a7" opacity="0.8"/>
    <path d="M1388 560 L1456 560 M1388 590 L1456 590 M1388 620 L1456 620" stroke="#f2d1a1" stroke-width="6" opacity="0.8"/>
  </g>

  <!-- Floor light patch -->
  <ellipse cx="900" cy="940" rx="520" ry="90" fill="#c5794a" opacity="0.13" filter="url(#softGlow)"/>

  <!-- Dust particles -->
  <g fill="#e5c9a2" opacity="0.6" filter="url(#dust)">
    <circle cx="370" cy="260" r="3"/>
    <circle cx="480" cy="330" r="2.5"/>
    <circle cx="880" cy="200" r="2.8"/>
    <circle cx="1160" cy="280" r="3"/>
    <circle cx="1348" cy="320" r="3"/>
    <circle cx="1040" cy="540" r="2.5"/>
    <circle cx="690" cy="470" r="2.8"/>
    <circle cx="1280" cy="620" r="2.4"/>
    <circle cx="560" cy="760" r="3"/>
    <circle cx="980" cy="720" r="2.8"/>
  </g>

  <!-- Explanatory overlay labels -->
  <g font-family="Verdana, Arial, sans-serif" font-weight="700" fill="#e7d4b8" letter-spacing="1.2">
    <text x="160" y="1040" font-size="28">REALIDAD NORMAL</text>
    <text x="1120" y="1040" font-size="28">OTRO LADO</text>
  </g>

  <g font-family="Verdana, Arial, sans-serif" font-size="22" fill="#f3d9b3" opacity="0.88">
    <text x="168" y="1090">Estanterías ordenadas</text>
    <text x="1190" y="1090">Textos deformados</text>
  </g>
</svg>
