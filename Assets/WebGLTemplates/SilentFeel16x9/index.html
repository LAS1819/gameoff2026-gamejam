<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Unity Web Player | {{{ PRODUCT_NAME }}}</title>
#if SHOW_DIAGNOSTICS
    <link rel="stylesheet" href="<<<TemplateData/diagnostics.css>>>">
    <script src="<<<TemplateData/diagnostics.js>>>"></script>
#endif
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }

      #unity-page {
        position: fixed;
        left: 0;
        top: 0;
        right: 0;
        bottom: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #unity-container {
        position: relative;
        width: min(100vw, 177.777vh);
        aspect-ratio: 16 / 9;
        background: #000;
      }

      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: {{{ BACKGROUND_FILENAME ? 'url(\'Build/' + BACKGROUND_FILENAME.replace(/'/g, '%27') + '\') center / cover' : BACKGROUND_COLOR }}};
      }

      #unity-fullscreen-button {
        position: absolute;
        right: 10px;
        bottom: 10px;
        z-index: 10;
        width: 36px;
        height: 36px;
        border: 0;
        border-radius: 4px;
        color: #fff;
        background: rgba(0, 0, 0, 0.7);
        font-size: 20px;
        line-height: 36px;
        text-align: center;
        cursor: pointer;
      }

      #unity-warning {
        position: absolute;
        left: 50%;
        top: 8px;
        transform: translateX(-50%);
        z-index: 20;
        display: none;
        background: #fff;
        color: #000;
        padding: 8px;
      }
    </style>
  </head>
  <body>
    <div id="unity-page">
      <div id="unity-container">
        <canvas id="unity-canvas" width="{{{ WIDTH }}}" height="{{{ HEIGHT }}}" tabindex="-1"></canvas>
        <button id="unity-fullscreen-button" type="button" aria-label="Fullscreen">&#x26F6;</button>
        <div id="unity-warning"></div>
      </div>
    </div>

#if SHOW_DIAGNOSTICS
    <div id="unity-footer">
      <img id="diagnostics-icon" src="TemplateData/webmemd-icon.png" alt="Diagnostics">
    </div>
#endif

    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var warningBanner = document.querySelector("#unity-warning");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? "block" : "none";
        }
        var div = document.createElement("div");
        div.textContent = msg;
        warningBanner.appendChild(div);
        if (type === "error") {
          div.style.background = "#f44";
        } else {
          div.style.background = "#ff4";
          setTimeout(function () {
            if (div.parentNode === warningBanner) {
              warningBanner.removeChild(div);
              updateBannerVisibility();
            }
          }, 5000);
        }
        updateBannerVisibility();
      }

      createUnityInstance(canvas, {
        arguments: [],
#if PROGRESSIVE_ASSET_LOADING
        primaryDataUrls: {{{ JSON.stringify(PRIMARY_DATA_FILES) }}},
        secondaryDataUrls: {{{ JSON.stringify(SECONDARY_DATA_FILES) }}},
#else
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
#endif
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        fullscreenElementID: "unity-container",
        showBanner: unityShowBanner
      }).then(function (unityInstance) {
        fullscreenButton.onclick = function () {
          unityInstance.SetFullscreen(1);
        };
#if SHOW_DIAGNOSTICS
        var diagnosticsIcon = document.getElementById("diagnostics-icon");
        if (diagnosticsIcon) {
          diagnosticsIcon.onclick = function () {
            unityDiagnostics.openDiagnosticsDiv(unityInstance.GetMetricsInfo);
          };
        }
#endif
      }).catch(function (message) {
        unityShowBanner(message, "error");
      });
    </script>
  </body>
</html>
